<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esthyfav Admin | Professional Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0A0A0A;
            color: #FFFFFF;
            overflow-x: hidden;
        }

        /* Login Page */
        .login-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0A0A0A 0%, #1A1A1A 100%);
        }
        .login-card {
            background: #111;
            padding: 50px;
            border-radius: 28px;
            border: 1px solid #D4AF37;
            width: 420px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .login-card h1 {
            font-size: 1.8rem;
            color: #D4AF37;
            margin-bottom: 10px;
        }
        .login-card p {
            color: #888;
            margin-bottom: 30px;
        }
        .login-card input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #1A1A1A;
            border: 1px solid #333;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
        }
        .login-card input:focus {
            outline: none;
            border-color: #D4AF37;
        }
        .login-card button {
            width: 100%;
            padding: 15px;
            background: #D4AF37;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
            color: #000;
            transition: all 0.3s;
        }
        .login-card button:hover {
            background: #B8960F;
            transform: translateY(-2px);
        }
        .error-msg {
            color: #ff4444;
            margin-top: 15px;
            font-size: 0.85rem;
        }

        /* Dashboard */
        .dashboard {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: #0D0D0D;
            border-right: 1px solid #D4AF37;
            padding: 30px 20px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        .sidebar-header {
            text-align: center;
            padding-bottom: 30px;
            border-bottom: 1px solid #D4AF37;
            margin-bottom: 30px;
        }
        .sidebar-header h2 {
            color: #D4AF37;
            font-size: 1.3rem;
        }
        .sidebar-header p {
            color: #666;
            font-size: 0.7rem;
            margin-top: 5px;
        }
        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            color: #aaa;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .sidebar-nav a:hover {
            background: rgba(212,175,55,0.1);
            color: #D4AF37;
        }
        .sidebar-nav a.active {
            background: rgba(212,175,55,0.15);
            color: #D4AF37;
            border-left: 3px solid #D4AF37;
        }
        .logout-btn {
            margin-top: 40px;
            padding: 12px;
            background: rgba(255,68,68,0.15);
            border: 1px solid rgba(255,68,68,0.3);
            border-radius: 10px;
            color: #ff6666;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }
        .logout-btn:hover {
            background: rgba(255,68,68,0.25);
        }

        /* Main Content */
        .main-content {
            margin-left: 280px;
            flex: 1;
            padding: 30px 40px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #D4AF37;
        }
        .page-title {
            font-size: 1.5rem;
            font-weight: 700;
        }
        .page-title i {
            color: #D4AF37;
            margin-right: 10px;
        }
        .admin-badge {
            background: rgba(212,175,55,0.1);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: #111;
            border-radius: 20px;
            padding: 25px;
            border: 1px solid #222;
            text-align: center;
            transition: all 0.3s;
        }
        .stat-card:hover {
            border-color: #D4AF37;
            transform: translateY(-3px);
        }
        .stat-card i {
            font-size: 2rem;
            color: #D4AF37;
            margin-bottom: 10px;
        }
        .stat-number {
            font-size: 2rem;
            font-weight: 800;
        }
        .stat-label {
            color: #888;
            font-size: 0.85rem;
        }

        /* Buttons */
        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 0.9rem;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: #D4AF37;
            color: #000;
        }
        .btn-primary:hover {
            background: #B8960F;
            transform: translateY(-2px);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #D4AF37;
            color: #D4AF37;
        }
        .btn-outline:hover {
            background: rgba(212,175,55,0.1);
        }
        .btn-danger {
            background: #ff4444;
            color: #fff;
        }
        .btn-danger:hover {
            background: #cc0000;
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .action-buttons {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* Tables */
        .table-container {
            background: #111;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #222;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            text-align: left;
            padding: 12px;
            color: #D4AF37;
            border-bottom: 1px solid #222;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #1A1A1A;
        }
        .product-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 10px;
            background: #1A1A1A;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .badge-gold {
            background: #D4AF37;
            color: #000;
        }
        .badge-gray {
            background: #333;
            color: #888;
        }
        .action-icons {
            display: flex;
            gap: 10px;
        }
        .action-icons button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 5px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .edit-btn { color: #00C853; }
        .edit-btn:hover { background: rgba(0,200,83,0.15); }
        .delete-btn { color: #ff4444; }
        .delete-btn:hover { background: rgba(255,68,68,0.15); }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #111;
            padding: 30px;
            border-radius: 20px;
            width: 500px;
            max-width: 90%;
            border: 1px solid #D4AF37;
        }
        .modal-content h3 {
            color: #D4AF37;
            margin-bottom: 20px;
        }
        .modal-content input, .modal-content select, .modal-content textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #1A1A1A;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
        }
        .modal-content label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Section visibility */
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }

        /* Confirm Modal */
        .confirm-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .confirm-content {
            background: #111;
            padding: 30px;
            border-radius: 20px;
            width: 400px;
            text-align: center;
            border: 1px solid #ff4444;
        }
        .confirm-content h3 { color: #ff4444; margin-bottom: 15px; }
        .confirm-content p { margin-bottom: 25px; color: #ccc; }
        .confirm-buttons { display: flex; gap: 15px; justify-content: center; }
        .confirm-buttons button { padding: 10px 25px; border-radius: 10px; cursor: pointer; font-weight: 600; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1A1A1A;
            border-left: 4px solid #D4AF37;
            padding: 15px 25px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 3000;
            transform: translateX(400px);
            transition: transform 0.3s;
        }
        .toast.show { transform: translateX(0); }

        @media (max-width: 768px) {
            .sidebar { width: 80px; padding: 20px 10px; }
            .sidebar-header h2, .sidebar-header p, .sidebar-nav a span { display: none; }
            .sidebar-nav a { justify-content: center; }
            .main-content { margin-left: 80px; padding: 20px; }
            .page-title { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<div id="root"></div>
<div id="toast" class="toast"><i class="fas fa-check-circle"></i> <span>Action completed</span></div>
<div id="confirmModal" class="confirm-modal">
    <div class="confirm-content">
        <h3><i class="fas fa-exclamation-triangle"></i> Confirm Delete</h3>
        <p id="confirmMessage">Are you sure you want to delete this item?</p>
        <div class="confirm-buttons">
            <button id="confirmYes" style="background:#ff4444; color:white;">Yes, Delete</button>
            <button id="confirmNo" style="background:#333; color:white;">Cancel</button>
        </div>
    </div>
</div>

<script>
    const API_URL = window.location.origin;
    let authToken = localStorage.getItem('adminToken');
    let pendingDelete = { type: null, id: null };

    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.querySelector('i').className = isError ? 'fas fa-exclamation-circle' : 'fas fa-check-circle';
        toast.querySelector('span').textContent = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function showConfirm(message, onConfirm) {
        const modal = document.getElementById('confirmModal');
        document.getElementById('confirmMessage').textContent = message;
        modal.style.display = 'flex';
        
        const handleYes = () => {
            modal.style.display = 'none';
            onConfirm();
            document.getElementById('confirmYes').removeEventListener('click', handleYes);
            document.getElementById('confirmNo').removeEventListener('click', handleNo);
        };
        const handleNo = () => {
            modal.style.display = 'none';
            document.getElementById('confirmYes').removeEventListener('click', handleYes);
            document.getElementById('confirmNo').removeEventListener('click', handleNo);
        };
        
        document.getElementById('confirmYes').onclick = handleYes;
        document.getElementById('confirmNo').onclick = handleNo;
    }

    if (authToken) {
        renderDashboard();
    } else {
        renderLogin();
    }

    function renderLogin() {
        document.getElementById('root').innerHTML = `
            <div class="login-container">
                <div class="login-card">
                    <i class="fas fa-crown" style="font-size: 3rem; color: #D4AF37; margin-bottom: 20px;"></i>
                    <h1>ESTHYFAV ADMIN</h1>
                    <p>Professional Management Dashboard</p>
                    <input type="email" id="loginEmail" placeholder="Email" value="admin@esthyfav.com">
                    <input type="password" id="loginPassword" placeholder="Password" value="devgift1">
                    <button onclick="handleLogin()"><i class="fas fa-arrow-right"></i> Login</button>
                    <div id="loginError" class="error-msg"></div>
                </div>
            </div>
        `;
    }

    async function handleLogin() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const errorDiv = document.getElementById('loginError');
        
        errorDiv.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
        
        try {
            const response = await fetch(`${API_URL}/api/admin/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            
            const data = await response.json();
            
            if (data.success && data.token) {
                authToken = data.token;
                localStorage.setItem('adminToken', authToken);
                showToast('Welcome back!');
                renderDashboard();
            } else {
                errorDiv.innerHTML = '<i class="fas fa-lock"></i> Invalid credentials';
            }
        } catch (err) {
            errorDiv.innerHTML = '<i class="fas fa-wifi"></i> Connection error';
        }
    }

    function logout() {
        localStorage.removeItem('adminToken');
        authToken = null;
        showToast('Logged out');
        renderLogin();
    }

    function showSection(section) {
        document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
        document.getElementById(`${section}Section`).classList.add('active');
        document.querySelectorAll('.sidebar-nav a').forEach(el => el.classList.remove('active'));
        document.querySelector(`.sidebar-nav a[data-section="${section}"]`).classList.add('active');
        
        const titles = {
            overview: 'Dashboard Overview',
            products: 'Product Management',
            categories: 'Category Management',
            messages: 'Customer Messages'
        };
        document.getElementById('pageTitle').innerHTML = `<i class="fas ${getIcon(section)}"></i> ${titles[section]}`;
        
        if (section === 'products') loadProducts();
        if (section === 'categories') loadCategories();
        if (section === 'messages') loadMessages();
        if (section === 'overview') loadStats();
    }

    function getIcon(section) {
        const icons = { overview: 'fa-chart-line', products: 'fa-box', categories: 'fa-tags', messages: 'fa-envelope' };
        return icons[section];
    }

    async function loadStats() {
        try {
            const res = await fetch(`${API_URL}/api/admin/stats`, { headers: { 'Authorization': authToken } });
            const stats = await res.json();
            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card"><i class="fas fa-box"></i><div class="stat-number">${stats.products || 0}</div><div class="stat-label">Products</div></div>
                <div class="stat-card"><i class="fas fa-tags"></i><div class="stat-number">${stats.categories || 0}</div><div class="stat-label">Categories</div></div>
                <div class="stat-card"><i class="fas fa-star"></i><div class="stat-number">${stats.bestsellers || 0}</div><div class="stat-label">Bestsellers</div></div>
                <div class="stat-card"><i class="fas fa-envelope"></i><div class="stat-number">${stats.messages || 0}</div><div class="stat-label">Messages</div></div>
            `;
        } catch(e) { console.error(e); }
    }

    async function loadProducts() {
        try {
            const res = await fetch(`${API_URL}/api/admin/products`, { headers: { 'Authorization': authToken } });
            const products = await res.json();
            document.getElementById('productsTableBody').innerHTML = products.map(p => `
                <tr>
                    <td><img src="${p.imageUrl || 'https://placehold.co/50x50/1A1A1A/D4AF37?text=Img'}" class="product-img" onerror="this.src='https://placehold.co/50x50/1A1A1A/D4AF37?text=No'"></td>
                    <td><strong>${escapeHtml(p.name)}</strong></td>
                    <td style="color:#D4AF37; font-weight:600;">${p.price}</td>
                    <td>${p.category}</td>
                    <td><span class="badge ${p.isBestseller ? 'badge-gold' : 'badge-gray'}">${p.isBestseller ? '⭐ Bestseller' : 'Standard'}</span></td>
                    <td class="action-icons">
                        <button class="edit-btn" onclick="editProduct('${p._id}')"><i class="fas fa-edit"></i></button>
                        <button class="delete-btn" onclick="deleteProductItem('${p._id}')"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        } catch(e) { console.error(e); }
    }

    async function loadCategories() {
        try {
            const res = await fetch(`${API_URL}/api/admin/categories`, { headers: { 'Authorization': authToken } });
            const categories = await res.json();
            document.getElementById('categoriesTableBody').innerHTML = categories.map(c => `
                <tr>
                    <td style="font-size:1.5rem;">${c.icon || '📦'}</td>
                    <td><strong>${escapeHtml(c.name)}</strong></td>
                    <td><code style="color:#888;">${c.slug}</code></td>
                    <td class="action-icons"><button class="delete-btn" onclick="deleteCategoryItem('${c._id}')"><i class="fas fa-trash"></i></button></td>
                </tr>
            `).join('');
        } catch(e) { console.error(e); }
    }

    async function loadMessages() {
        try {
            const res = await fetch(`${API_URL}/api/admin/contacts`, { headers: { 'Authorization': authToken } });
            const messages = await res.json();
            document.getElementById('messagesTableBody').innerHTML = messages.map(m => `
                <tr>
                    <td><strong>${escapeHtml(m.name)}</strong></td>
                    <td><a href="mailto:${m.email}" style="color:#D4AF37;">${m.email}</a></td>
                    <td>${m.phone || '-'}</td>
                    <td style="max-width:300px;">${escapeHtml(m.message.substring(0, 80))}${m.message.length > 80 ? '...' : ''}</td>
                    <td style="color:#666; font-size:0.8rem;">${new Date(m.createdAt).toLocaleDateString()}</td>
                </tr>
            `).join('');
        } catch(e) { console.error(e); }
    }

    function openProductModal(product = null) {
        const modal = document.getElementById('productModal');
        if (product) {
            document.getElementById('productModalTitle').innerHTML = '<i class="fas fa-edit"></i> Edit Product';
            document.getElementById('productId').value = product._id;
            document.getElementById('productName').value = product.name;
            document.getElementById('productPrice').value = product.price;
            document.getElementById('productCategory').value = product.category;
            document.getElementById('productBestseller').checked = product.isBestseller;
        } else {
            document.getElementById('productModalTitle').innerHTML = '<i class="fas fa-plus"></i> Add Product';
            document.getElementById('productId').value = '';
            document.getElementById('productName').value = '';
            document.getElementById('productPrice').value = '';
            document.getElementById('productCategory').value = 'Unisex Wears';
            document.getElementById('productBestseller').checked = false;
        }
        document.getElementById('productImage').value = '';
        modal.style.display = 'flex';
    }

    async function editProduct(id) {
        const res = await fetch(`${API_URL}/api/admin/products`, { headers: { 'Authorization': authToken } });
        const products = await res.json();
        const product = products.find(p => p._id === id);
        openProductModal(product);
    }

    async function saveProduct() {
        const id = document.getElementById('productId').value;
        const formData = new FormData();
        formData.append('name', document.getElementById('productName').value);
        formData.append('price', document.getElementById('productPrice').value);
        formData.append('category', document.getElementById('productCategory').value);
        formData.append('isBestseller', document.getElementById('productBestseller').checked);
        
        const imageFile = document.getElementById('productImage').files[0];
        if (imageFile) formData.append('image', imageFile);
        
        const url = id ? `${API_URL}/api/admin/products/${id}` : `${API_URL}/api/admin/products`;
        const method = id ? 'PUT' : 'POST';
        
        const res = await fetch(url, { method, headers: { 'Authorization': authToken }, body: formData });
        if (res.ok) {
            closeModal('productModal');
            loadProducts();
            loadStats();
            showToast(id ? 'Product updated!' : 'Product added!');
        } else {
            showToast('Error saving product', true);
        }
    }

    function deleteProductItem(id) {
        showConfirm('Are you sure you want to delete this product?', async () => {
            await fetch(`${API_URL}/api/admin/products/${id}`, { method: 'DELETE', headers: { 'Authorization': authToken } });
            loadProducts();
            loadStats();
            showToast('Product deleted');
        });
    }

    function openCategoryModal() {
        document.getElementById('categoryModal').style.display = 'flex';
        document.getElementById('categoryName').value = '';
        document.getElementById('categorySlug').value = '';
        document.getElementById('categoryIcon').value = '';
        document.getElementById('categoryImage').value = '';
    }

    async function saveCategory() {
        const formData = new FormData();
        formData.append('name', document.getElementById('categoryName').value);
        formData.append('slug', document.getElementById('categorySlug').value);
        formData.append('icon', document.getElementById('categoryIcon').value);
        const imageFile = document.getElementById('categoryImage').files[0];
        if (imageFile) formData.append('image', imageFile);
        
        const res = await fetch(`${API_URL}/api/admin/categories`, { method: 'POST', headers: { 'Authorization': authToken }, body: formData });
        if (res.ok) {
            closeModal('categoryModal');
            loadCategories();
            loadStats();
            showToast('Category added!');
        }
    }

    function deleteCategoryItem(id) {
        showConfirm('Are you sure you want to delete this category?', async () => {
            await fetch(`${API_URL}/api/admin/categories/${id}`, { method: 'DELETE', headers: { 'Authorization': authToken } });
            loadCategories();
            loadStats();
            showToast('Category deleted');
        });
    }

    function closeModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function renderDashboard() {
        document.getElementById('root').innerHTML = `
            <div class="dashboard">
                <div class="sidebar">
                    <div class="sidebar-header">
                        <h2><i class="fas fa-crown"></i> ESTHYFAV</h2>
                        <p>Professional Admin</p>
                    </div>
