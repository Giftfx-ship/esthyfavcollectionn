<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esthyfav Admin Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0A0A0A;
            color: #fff;
        }
        
        /* Login Page */
        .login-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0A0A0A 0%, #1A1A1A 100%);
        }
        .login-box {
            background: #111;
            padding: 50px;
            border-radius: 24px;
            border: 1px solid #D4AF37;
            width: 400px;
            text-align: center;
        }
        .login-box h1 { color: #D4AF37; margin-bottom: 10px; font-size: 1.8rem; }
        .login-box p { color: #888; margin-bottom: 30px; }
        .login-box input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background: #1A1A1A;
            border: 1px solid #333;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
        }
        .login-box button {
            width: 100%;
            padding: 14px;
            background: #D4AF37;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
        }
        .error { color: #ff4444; margin-top: 15px; font-size: 0.9rem; }
        
        /* Dashboard */
        .dashboard {
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #D4AF37;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 { font-size: 1.5rem; color: #D4AF37; }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: #111;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #222;
            text-align: center;
        }
        .stat-card h2 { color: #D4AF37; font-size: 2rem; margin-bottom: 8px; }
        .stat-card p { color: #888; }
        
        .section-title {
            margin: 30px 0 20px 0;
            font-size: 1.3rem;
            color: #D4AF37;
        }
        
        button {
            background: #D4AF37;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        .logout-btn { background: #ff4444; color: white; }
        .btn-danger { background: #ff4444; color: white; }
        .btn-edit { background: #00C853; color: white; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #222;
        }
        th { color: #D4AF37; background: #0D0D0D; }
        
        .product-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
            background: #222;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #111;
            padding: 30px;
            border-radius: 20px;
            width: 500px;
            max-width: 90%;
            border: 1px solid #D4AF37;
        }
        .modal-content h3 { margin-bottom: 20px; color: #D4AF37; }
        .modal-content input, .modal-content select, .modal-content textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #1A1A1A;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
        }
        .modal-content input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
        }
        
        @media (max-width: 768px) {
            .dashboard { padding: 15px; }
            table { font-size: 0.8rem; }
            th, td { padding: 8px; }
            .stats { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
<div id="root"></div>

<script>
    const API_URL = window.location.origin;
    let authToken = localStorage.getItem('adminToken');
    
    // Check if token exists and is valid
    if (authToken) {
        renderDashboard();
    } else {
        renderLogin();
    }
    
    function renderLogin() {
        document.getElementById('root').innerHTML = `
            <div class="login-container">
                <div class="login-box">
                    <h1>✦ ESTHYFAV ADMIN</h1>
                    <p>Login to manage your store</p>
                    <input type="email" id="loginEmail" placeholder="Email" value="admin@esthyfav.com">
                    <input type="password" id="loginPassword" placeholder="Password" value="devgift1">
                    <button onclick="handleLogin()">Login →</button>
                    <div id="loginError" class="error"></div>
                </div>
            </div>
        `;
    }
    
    async function handleLogin() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const errorDiv = document.getElementById('loginError');
        
        errorDiv.textContent = 'Logging in...';
        
        try {
            const response = await fetch(`${API_URL}/api/admin/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            
            const data = await response.json();
            
            if (data.success && data.token) {
                authToken = data.token;
                localStorage.setItem('adminToken', authToken);
                renderDashboard();
            } else {
                errorDiv.textContent = data.error || 'Login failed. Use admin@esthyfav.com / devgift1';
            }
        } catch (err) {
            errorDiv.textContent = 'Connection error. Make sure the server is running.';
            console.error('Login error:', err);
        }
    }
    
    function logout() {
        localStorage.removeItem('adminToken');
        authToken = null;
        renderLogin();
    }
    
    async function renderDashboard() {
        // Fetch data
        let stats = { products: 0, categories: 0, messages: 0 };
        let products = [];
        let categories = [];
        let contacts = [];
        
        try {
            const statsRes = await fetch(`${API_URL}/api/admin/stats`, { headers: { 'Authorization': authToken } });
            stats = await statsRes.json();
        } catch(e) { console.error('Stats error:', e); }
        
        try {
            const productsRes = await fetch(`${API_URL}/api/admin/products`, { headers: { 'Authorization': authToken } });
            products = await productsRes.json();
        } catch(e) { console.error('Products error:', e); }
        
        try {
            const categoriesRes = await fetch(`${API_URL}/api/admin/categories`, { headers: { 'Authorization': authToken } });
            categories = await categoriesRes.json();
        } catch(e) { console.error('Categories error:', e); }
        
        try {
            const contactsRes = await fetch(`${API_URL}/api/admin/contacts`, { headers: { 'Authorization': authToken } });
            contacts = await contactsRes.json();
        } catch(e) { console.error('Contacts error:', e); }
        
        document.getElementById('root').innerHTML = `
            <div class="dashboard">
                <div class="header">
                    <h1>✦ ESTHYFAV ADMIN DASHBOARD</h1>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
                
                <div class="stats">
                    <div class="stat-card"><h2>${stats.products || 0}</h2><p>Total Products</p></div>
                    <div class="stat-card"><h2>${stats.categories || 0}</h2><p>Categories</p></div>
                    <div class="stat-card"><h2>${stats.messages || 0}</h2><p>Messages</p></div>
                    <div class="stat-card"><h2>${stats.bestsellers || 0}</h2><p>Bestsellers</p></div>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <button onclick="openProductModal()">➕ Add New Product</button>
                    <button onclick="openCategoryModal()">🏷️ Add Category</button>
                    <button onclick="renderDashboard()">🔄 Refresh All</button>
                </div>
                
                <h3 class="section-title">📦 Products</h3>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr><th>Image</th><th>Name</th><th>Price</th><th>Category</th><th>Bestseller</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="productsTableBody">
                            ${products.map(p => `
                                <tr>
                                    <td><img src="${p.imageUrl || ''}" class="product-img" onerror="this.src='https://placehold.co/50x50/333/D4AF37?text=No+Img'"></td>
                                    <td>${escapeHtml(p.name)}</td>
                                    <td>${p.price}</td>
                                    <td>${p.category}</td>
                                    <td>${p.isBestseller ? '⭐ Yes' : 'No'}</td>
                                    <td>
                                        <button class="btn-edit" onclick="editProduct('${p._id}')">Edit</button>
                                        <button class="btn-danger" onclick="deleteProduct('${p._id}')">Delete</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
                
                <h3 class="section-title">🏷️ Categories</h3>
                <div style="overflow-x: auto;">
                    <table>
                        <thead><tr><th>Icon</th><th>Name</th><th>Slug</th><th>Actions</th></tr></thead>
                        <tbody id="categoriesTableBody">
                            ${categories.map(c => `
                                <tr>
                                    <td>${c.icon || '📦'}</td>
                                    <td>${escapeHtml(c.name)}</td>
                                    <td>${c.slug}</td>
                                    <td><button class="btn-danger" onclick="deleteCategory('${c._id}')">Delete</button></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
                
                <h3 class="section-title">📧 Contact Messages</h3>
                <div style="overflow-x: auto;">
                    <table>
                        <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Message</th><th>Date</th></tr></thead>
                        <tbody id="contactsTableBody">
                            ${contacts.map(c => `
                                <tr>
                                    <td>${escapeHtml(c.name)}</td>
                                    <td>${escapeHtml(c.email)}</td>
                                    <td>${c.phone || '-'}</td>
                                    <td>${escapeHtml(c.message.substring(0, 50))}${c.message.length > 50 ? '...' : ''}</td>
                                    <td>${new Date(c.createdAt).toLocaleDateString()}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!-- Product Modal -->
            <div id="productModal" class="modal">
                <div class="modal-content">
                    <h3 id="productModalTitle">Add Product</h3>
                    <input type="hidden" id="productId">
                    <input type="text" id="productName" placeholder="Product Name">
                    <input type="text" id="productPrice" placeholder="Price (e.g., ₦25,000)">
                    <select id="productCategory">
                        <option>Unisex Wears</option><option>Stylish Bags</option><option>Comfy Shoes</option>
                        <option>Girly Essentials</option><option>Household Items</option>
                    </select>
                    <label><input type="checkbox" id="productBestseller"> Mark as Bestseller</label>
                    <input type="file" id="productImage" accept="image/*">
                    <button onclick="saveProduct()">Save Product</button>
                    <button onclick="closeModal('productModal')" style="background:#333;">Cancel</button>
                </div>
            </div>
            
            <!-- Category Modal -->
            <div id="categoryModal" class="modal">
                <div class="modal-content">
                    <h3>Add Category</h3>
                    <input type="text" id="categoryName" placeholder="Category Name">
                    <input type="text" id="categorySlug" placeholder="slug (e.g., unisex-wears)">
                    <input type="text" id="categoryIcon" placeholder="Icon emoji (e.g., 👕)">
                    <input type="file" id="categoryImage" accept="image/*">
                    <button onclick="saveCategory()">Save Category</button>
                    <button onclick="closeModal('categoryModal')" style="background:#333;">Cancel</button>
                </div>
            </div>
        `;
    }
    
    // Product functions
    function openProductModal(product = null) {
        const modal = document.getElementById('productModal');
        const title = document.getElementById('productModalTitle');
        const idField = document.getElementById('productId');
        const nameField = document.getElementById('productName');
        const priceField = document.getElementById('productPrice');
        const categoryField = document.getElementById('productCategory');
        const bestsellerField = document.getElementById('productBestseller');
        
        if (product) {
            title.textContent = 'Edit Product';
            idField.value = product._id;
            nameField.value = product.name;
            priceField.value = product.price;
            categoryField.value = product.category;
            bestsellerField.checked = product.isBestseller;
        } else {
            title.textContent = 'Add Product';
            idField.value = '';
            nameField.value = '';
            priceField.value = '';
            categoryField.value = 'Unisex Wears';
            bestsellerField.checked = false;
        }
        modal.style.display = 'flex';
    }
    
    async function editProduct(id) {
        const res = await fetch(`${API_URL}/api/admin/products`, { headers: { 'Authorization': authToken } });
        const products = await res.json();
        const product = products.find(p => p._id === id);
        openProductModal(product);
    }
    
    async function saveProduct() {
        const id = document.getElementById('productId').value;
        const formData = new FormData();
        formData.append('name', document.getElementById('productName').value);
        formData.append('price', document.getElementById('productPrice').value);
        formData.append('category', document.getElementById('productCategory').value);
        formData.append('isBestseller', document.getElementById('productBestseller').checked);
        
        const imageFile = document.getElementById('productImage').files[0];
        if (imageFile) formData.append('image', imageFile);
        
        const url = id ? `${API_URL}/api/admin/products/${id}` : `${API_URL}/api/admin/products`;
        const method = id ? 'PUT' : 'POST';
        
        await fetch(url, { method, headers: { 'Authorization': authToken }, body: formData });
        closeModal('productModal');
        renderDashboard();
    }
    
    async function deleteProduct(id) {
        if (confirm('Are you sure you want to delete this product?')) {
            await fetch(`${API_URL}/api/admin/products/${id}`, { method: 'DELETE', headers: { 'Authorization': authToken } });
            renderDashboard();
        }
    }
    
    // Category functions
    function openCategoryModal() {
        document.getElementById('categoryModal').style.display = 'flex';
        document.getElementById('categoryName').value = '';
        document.getElementById('categorySlug').value = '';
        document.getElementById('categoryIcon').value = '';
    }
    
    async function saveCategory() {
        const formData = new FormData();
        formData.append('name', document.getElementById('categoryName').value);
        formData.append('slug', document.getElementById('categorySlug').value);
        formData.append('icon', document.getElementById('categoryIcon').value);
        
        const imageFile = document.getElementById('categoryImage').files[0];
        if (imageFile) formData.append('image', imageFile);
        
        await fetch(`${API_URL}/api/admin/categories`, { method: 'POST', headers: { 'Authorization': authToken }, body: formData });
        closeModal('categoryModal');
        renderDashboard();
    }
    
    async function deleteCategory(id) {
        if (confirm('Delete this category?')) {
            await fetch(`${API_URL}/api/admin/categories/${id}`, { method: 'DELETE', headers: { 'Authorization': authToken } });
            renderDashboard();
        }
    }
    
    function closeModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
</script>
</body>
</html>
